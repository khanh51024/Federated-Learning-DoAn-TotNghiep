[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fl-training"
version = "0.1.0"
description = "Federated Learning pipeline for PlantVillage MobileNetV3-Small with FedAvg (Stage 2 Scratch v4)"
authors = [{ name = "FL Research Team" }]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6.0,<2.7.0",
    "torchvision>=0.21.0,<0.22.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "Pillow>=9.1.0",
    "PyYAML>=6.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]
flower = [
    "flwr[simulation]>=1.36.0,<1.37.0",
    "ray>=2.55.0,<2.56.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "fl_training*", "stage1_compat*", "stage2_matched*", "stage2_scratch*"]

[tool.setuptools.package-data]
stage1_compat = [
    "*.json",
    "upstream/**/*.py",
    "upstream/**/*.json",
    "upstream/**/*.md",
    "upstream/**/*.txt",
]

[tool.pyright]
extraPaths = ["."]
