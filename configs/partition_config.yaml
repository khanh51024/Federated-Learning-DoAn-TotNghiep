# ---------------------------------------------------------------------------
# GĐ2 -- Cấu hình chia dữ liệu non-IID cho PlantVillage Federated Learning
# ---------------------------------------------------------------------------
# Mọi đường dẫn tương đối được neo tại THƯ MỤC GÓC của package này
# (gd2_federated_learning/), KHÔNG phải thư mục làm việc hiện hành.

dataset:
  # Thư mục ảnh màu PlantVillage (38 lớp cây–bệnh, 54,305 ảnh).
  path: "../PlantVillage-Dataset/raw/color"
  # leaf-map.json của bộ dữ liệu: ảnh -> lá vật lý. Dùng để chia theo NHÓM LÁ,
  # tránh rò rỉ ảnh gần trùng lặp giữa train/test và giữa các client.
  leaf_map_path: "../PlantVillage-Dataset/leaf-map.json"
  # true  = đơn vị chia là cả một chiếc lá (khuyến nghị, chống leakage)
  # false = chia theo từng ảnh (hành vi cũ, chỉ dùng để đối chứng)
  group_aware: true
  # Tỉ lệ tập kiểm thử TOÀN CỤC, tách stratified theo lớp TRƯỚC khi chia client.
  # Cả ba mốc Centralized / Federated / Local-only đều chấm trên cùng tập này.
  test_ratio: 0.20
  # Tập val toàn cục (0.0 = không tách).
  val_ratio: 0.0

partition:
  # Số cơ sở nông nghiệp / client.
  num_clients: 10
  # Kịch bản phân tán:
  #   iid                  -- tham chiếu đồng nhất (điểm neo cho đường cong α)
  #   label_skew           -- "lệch nhãn":     p_k ~ Dirichlet(alpha)
  #   quantity_skew        -- "lệch số lượng": q ~ Dirichlet(quantity_alpha)
  #   label_quantity_skew  -- cả hai cùng lúc
  scenario: "label_skew"
  # Tham số nồng độ Dirichlet. alpha -> lớn : gần IID. alpha -> nhỏ : non-IID mạnh.
  alpha: 0.1
  # Nồng độ Dirichlet cho số lượng client (chỉ dùng cho *_quantity_skew).
  # Giá trị nhỏ tạo chênh lệch số lượng mạnh; tách biệt với alpha lệch nhãn.
  quantity_alpha: 0.1
  # "lệch đặc trưng": miền thu nhận ảnh riêng của từng cơ sở, áp dụng lúc load.
  #   none | mild | moderate | strong
  # Để ở tầng transform (không nướng vào manifest) nên cùng một bộ chia có thể
  # chạy lại với feature skew bật/tắt -- đúng thứ một phép ablation cần.
  feature_skew: "none"
  seed: 42
  # Ngưỡng an toàn: số mẫu tối thiểu mỗi client phải có.
  min_samples_per_client: 10
  # Số lần thử lại tối đa nếu ngưỡng an toàn không đạt.
  max_retries: 20
  # Ngưỡng "lớp hiếm" (số mẫu toàn cục) để báo cáo độ phủ lớp hiếm mỗi client.
  rare_class_threshold: 500

# Tỷ lệ val riêng trong TỪNG client (group-aware), phục vụ early stopping cục bộ.
# 0.0 = không tách; toàn bộ dữ liệu client dành cho huấn luyện.
client_val_ratio: 0.0

output:
  # Thư mục gốc chứa các bộ chia. Mỗi cấu hình nằm ở
  #   <base_dir>/<scenario>/<scenario>__seed_<s>__<parameters>
  base_dir: "data/partitions_v3"

# ---------------------------------------------------------------------------
# Quét α (scripts/sweep_alpha.py) -- dùng cho "đường cong accuracy theo α"
# ở GĐ2/GĐ5: chứng minh khoảng cách Phân tán – Tập trung nới rộng khi non-IID tăng.
# ---------------------------------------------------------------------------
sweep:
  scenario: "label_skew"
  alphas: [0.05, 0.1, 0.5, 1.0, 5.0, 100.0]
  seeds: [42]
  num_clients: 10
  feature_skew: "none"
  # Các kịch bản bổ sung. Mỗi seed và mọi cấu hình dùng chung global test.
  extra_scenarios:
    - {scenario: "iid", feature_skew: "none"}
    - {scenario: "quantity_skew", quantity_alpha: 0.1, feature_skew: "none"}
    - {scenario: "quantity_skew", quantity_alpha: 1.0, feature_skew: "none"}
    - {scenario: "label_quantity_skew", alpha: 0.1, quantity_alpha: 0.1, feature_skew: "none"}
    - {scenario: "iid", feature_skew: "moderate"}
  include_image_level_ablation: false
