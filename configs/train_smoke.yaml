schema_version: 1
data:
  dataset_root: ../PlantVillage-Dataset/raw/color
  partition_index: data/partitions_train_v1/index.json
  bundle_path: data/partitions_train_v1/smoke_bundle_2c
  scenario: label_skew
  alpha: 0.1
  quantity_alpha: null
  feature_skew: none
  split_seed: 42
model:
  name: mobilenet_v3_small
  num_classes: 38
  weights: null
training:
  seed: 42
  local_epochs: 1
  batch_size: 16
  eval_batch_size: 32
  optimizer: sgd
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0001
  amp: false
  num_workers: 0
federation:
  num_clients: 2
  fraction_train: 1.0
  min_train_nodes: 2
  max_rounds: 2
  timeout_seconds: 180
early_stopping:
  enabled: false
  monitor: val_loss
  min_delta: 0.0001
  patience_rounds: 10
  warmup_rounds: 10
lr_scheduler:
  enabled: false
  factor: 0.5
  patience_rounds: 3
  threshold: 0.0001
  min_lr: 0.000001
runtime:
  client_device: cpu
  server_device: cpu
  max_concurrent_clients: 1
  cpus_per_client: 2
  object_store_memory_mb: 256
  startup_timeout_seconds: 120
output:
  root: runs/fedavg
  progress: true
  evaluate_test_after_train: false
checkpoint:
  every_n_rounds: 1
  keep_last_n: 2
diagnostics:
  plateau_rounds: 3
  divergence_window: 3
  divergence_relative_increase: 0.02
  low_recall_threshold: 0.5
  small_client_samples: 50
  update_norm_outlier_factor: 5.0
