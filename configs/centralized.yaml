# Cấu hình Huấn luyện Tập trung (Centralized Baseline)
experiment: "centralized"
model:
  backbone: "mobilenetv3_small"
  num_classes: 38
  pretrained: false  # Khóa protocol Scratch GĐ2

training:
  epochs: 10
  batch_size: 32
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0001

data:
  dataset_name: "PlantVillage"
  partition_dir: "data/partitions_stage2_scratch_v3/label100"
  train_csv: "data/partitions_stage2_scratch_v3/label100/centralized_train.csv"
  val_csv: "data/partitions_stage2_scratch_v3/label100/global_val.csv"
  test_csv: "data/partitions_stage2_scratch_v3/label100/global_test.csv"
  image_size: [224, 224]

output:
  checkpoints_dir: "artifacts/checkpoints"
  metrics_dir: "artifacts/metrics"
