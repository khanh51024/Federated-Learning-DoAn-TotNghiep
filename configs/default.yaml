# Cấu hình mặc định cho Federated Learning & Baselines (PlantVillage)
dataset:
  name: "PlantVillage"
  partition_dir: "data/partitions_stage2_scratch_v3/label100"
  dataset_root: null
  num_classes: 38
  batch_size: 32

training:
  optimizer: "SGD"
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0001
  pretrained: false
  seed: 42

federation:
  num_clients: 5
  rounds: 10
  local_epochs: 1
  min_fit_clients: 5

output:
  artifacts_dir: "artifacts"
  checkpoints_dir: "artifacts/checkpoints"
  metrics_dir: "artifacts/metrics"
