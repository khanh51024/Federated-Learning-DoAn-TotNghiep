# Các đoạn cấu hình nginx cho học liên kết cộng đồng (xem docs/COMMUNITY_FL.md, mục "Triển khai").
# Chèn vào file /etc/nginx/sites-available/datn.tranngochung.id.vn hiện có: `limit_req_zone` và `gzip_types` ở mức http
# (đặt trong /etc/nginx/conf.d/cropfed-community.conf), các `location` bên trong khối `server`.

# ── mức http ────────────────────────────────────────────────────────────────────────────────────────
# Hạn mức theo IP phải đủ rộng cho một lớp/hội trường ra Internet qua MỘT địa chỉ NAT: 100 người vào trong vài phút và mỗi
# người gửi 1 cập nhật mỗi vòng. Ứng dụng đã có hạn mức riêng theo người tham gia (token) và theo IP (COMMUNITY_RATE_SCALE);
# nginx chỉ là lớp chặn thô. Nếu sự kiện lớn hơn, nâng rate/burst ở đây tương ứng.
limit_req_zone $binary_remote_addr zone=community_update:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=community_join:10m   rate=120r/m;
limit_req_zone $binary_remote_addr zone=community_admin:10m  rate=20r/m;

# onnxruntime-web (.wasm, ~11 MB) nén còn ~3 MB. `gzip on;` thường đã có sẵn ở /etc/nginx/nginx.conf (khai báo lặp sẽ làm
# `nginx -t` báo lỗi "directive is duplicate"); ở đây chỉ bổ sung loại nội dung cần nén.
# `text/css` BẮT BUỘC có: CSS chặn lần vẽ đầu; thiếu nó thì ~100 KB CSS đi dạng thô (curl ngày 2026-10-14: pages.css 61 547 B,
# không có Content-Encoding). HTTP/2 (`http2 on;` cạnh `listen 443 ssl;`, nginx >= 1.25.1) cũng nên bật vì trang nạp ~37 tệp.
gzip_types application/wasm text/javascript application/javascript application/json text/css image/svg+xml text/plain;
gzip_min_length 1024;
gzip_vary on;

# ── trong khối server { ... } ───────────────────────────────────────────────────────────────────────
# QUAN TRỌNG: đặt ở mức server để MỌI location (kể cả `location /` hiện có) ghi đè X-Forwarded-For bằng địa chỉ thật của kết nối.
# Nếu một location tự khai báo proxy_set_header thì nó KHÔNG thừa hưởng dòng này: lặp lại dòng này trong location đó.
# Không ghi đè thì client tự đặt X-Forwarded-For được và lách mọi hạn mức theo IP của ứng dụng.
proxy_set_header X-Forwarded-For $remote_addr;

# Cập nhật của người tham gia: ~208 KB base64. Trần 1 MB (toàn site đang là 50M cho ảnh chẩn đoán).
location = /api/community/update {
    client_max_body_size 1m;
    limit_req zone=community_update burst=200 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8088;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /api/community/join {
    client_max_body_size 8k;
    limit_req zone=community_join burst=200 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8088;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Trang quản trị /quan-tri (tệp tĩnh) và API quản trị: nên chỉ cho IP tin cậy. Bỏ comment và thay IP.
# location = /quan-tri {
#     allow 203.0.113.10;
#     deny all;
#     proxy_pass http://127.0.0.1:8088;
#     proxy_set_header X-Forwarded-For $remote_addr;
# }

# Quản trị: thân yêu cầu rất nhỏ (cấu hình, mã). Nên giới hạn thêm theo IP tin cậy (bỏ comment và thay IP);
# ngoài ra vẫn cần tài khoản + mật khẩu quản trị (COMMUNITY_ADMIN_TOKEN, >= 12 ký tự).
location /api/community/admin/ {
    client_max_body_size 8k;
    limit_req zone=community_admin burst=10 nodelay;
    limit_req_status 429;
    # allow 203.0.113.10;
    # deny all;
    proxy_pass http://127.0.0.1:8088;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
