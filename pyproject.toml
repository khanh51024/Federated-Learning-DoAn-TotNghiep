[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fl-plantvillage"
version = "0.2.0"
description = "Federated Learning PlantVillage (MobileNetV3-Small, Flower, FedAvg) — engine src/, web demo, model registry"
authors = [{ name = "FL Research Team" }]
requires-python = ">=3.11"
# Khai báo MỘT nơi: danh sách này phải trùng requirements.txt (PROJECT_STATUS.md tự kiểm).
# Pipeline Kaggle cũ có ghim phiên bản riêng ở legacy/pyproject.toml.
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "flwr>=1.30.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "Pillow>=9.1.0",
    "PyYAML>=6.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "web*", "scripts*"]

[tool.pyrefly]
search-path = ["."]
disable-search-path-heuristics = true
python-interpreter-path = ".venv/Scripts/python.exe"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["legacy", ".venv", ".git", "artifacts", "results", "data", "pytest-of-*"]

[tool.pyright]
extraPaths = ["."]
