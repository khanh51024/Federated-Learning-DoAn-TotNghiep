# Primary GĐ2 experiment: FedAvg only, keeping training/model/budget fixed.
# Centralized and Local-only are controls in sweep_content_aware_v4.yaml.
protocol: content_aware_v4
primary_mode: fedavg
role: main
base_config: configs/train_fedavg_v4.yaml
output_root: runs/stage2_fedavg
sweep_id: content_aware_v4_3seeds
modes: [fedavg]
seeds: [42, 123, 2026]
conditions:
  - {scenario: iid, feature_skew: none, split_seed: 42}
  - {scenario: label_skew, alpha: 100.0, feature_skew: none, split_seed: 42}
  - {scenario: label_skew, alpha: 1.0, feature_skew: none, split_seed: 42}
  - {scenario: label_skew, alpha: 0.1, feature_skew: none, split_seed: 42}
  - {scenario: quantity_skew, quantity_alpha: 1.0, feature_skew: none, split_seed: 42}
  - {scenario: quantity_skew, quantity_alpha: 0.1, feature_skew: none, split_seed: 42}
  - {scenario: label_quantity_skew, alpha: 0.1, quantity_alpha: 0.1, feature_skew: none, split_seed: 42}
  - {scenario: iid, feature_skew: moderate, split_seed: 42}
  - {scenario: label_skew, alpha: 0.1, feature_skew: moderate, split_seed: 42}
