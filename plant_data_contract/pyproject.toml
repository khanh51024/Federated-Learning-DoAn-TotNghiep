[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plant_data_contract"
version = "0.1.3"
description = "Canonical Data Contract, Schema, Taxonomy, Crop Policy, and Manifest Reader for PlantVillage and PlantDoc"
authors = [{ name = "Do An Tot Nghiep" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "torchvision",
    "pillow",
    "pyyaml"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["plant_data_contract*"]
